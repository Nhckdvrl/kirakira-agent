[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kirakira-agent"
version = "0.1.0"
description = "A multi-channel, extensible AI agent runtime with memory, plugins, and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=6.12,<9"]
keywords = ["agent", "harness", "tool-calling"]

[project.scripts]
kirakira-agent = "kirakira_agent.cli:main"

[tool.setuptools.packages.find]
include = ["kirakira_agent*"]
