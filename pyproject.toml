[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kirakira-agent"
version = "0.1.0"
description = "A multi-channel, extensible AI agent runtime with memory, plugins, and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.11,<4",
    "click>=8.1,<9",
    "textual>=6.12,<9",
    "httpx[socks]>=0.28.0",
    "html2text>=2025.4.0",
    "jieba>=0.42",  # akasha RAR 引擎的中文分词
    "json-repair>=0.44.1",
    "lxml>=6.0.0",
    "Pillow>=11.0.0",
    "python-telegram-bot>=22.7",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "sqlite-vec>=0.1.6",
    "telegramify-markdown>=0.5",
    "websockets>=15,<17",
    "yoyo-migrations==9.0.0",
]
keywords = ["agent", "harness", "tool-calling"]

[project.scripts]
kirakira-agent = "bootstrap.main:main"
kirakira-impact = "scripts.check_change_impact:main"
kirakira-verify-online = "scripts.verify_online:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]

[tool.setuptools.packages.find]
include = [
    "agent*",
    "bootstrap*",
    "bus*",
    "core*",
    "eval*",
    "frontend*",
    "infra*",
    "kirakira_agent*",
    "memory2*",
    "migrations*",
    "plugin_packages*",
    "plugins*",
    "proactive_v2*",
    "session*",
    "scripts*",
]

[tool.setuptools.package-data]
"migrations" = ["yoyo/*.py"]
"plugin_packages.curated_feeds" = [
    "README.md",
    "config.toml",
    "drift-skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
