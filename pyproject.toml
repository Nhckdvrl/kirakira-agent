[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kirakira-agent"
version = "0.1.0"
description = "A multi-channel, extensible AI agent runtime with memory, plugins, and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "textual>=6.12,<9",
    "httpx[socks]>=0.28.0",
    "html2text>=2025.4.0",
    "json-repair>=0.44.1",
    "lxml>=6.0.0",
    "Pillow>=11.0.0",
    "python-telegram-bot>=22.7",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "sqlite-vec>=0.1.6",
    "telegramify-markdown>=0.5",
    "websockets>=15,<17",
]
keywords = ["agent", "harness", "tool-calling"]

[project.scripts]
kirakira-agent = "kirakira_agent.entry:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]

[tool.setuptools.packages.find]
include = ["kirakira_agent*", "agent*", "bus*", "core*", "infra*", "session*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
