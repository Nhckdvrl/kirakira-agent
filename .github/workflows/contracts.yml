name: Runtime contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen --group dev --extra providers
      - run: uv run --frozen python scripts/check_upstream_kernel.py
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m scripts.check_feature_alignment
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: uv build
      - run: uv run python -m kirakira_agent --help
      # Paid/provider evaluations are explicit local commands, never CI defaults.
